# Builds the static web app (no backend) and deploys it to Cloudflare Pages.
# Manual only (workflow_dispatch) so a push never fails while the secrets are absent.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.
# Prefer no secrets at all? Use the GitHub Pages workflow instead, or connect the repo in
# the Cloudflare Pages dashboard — see docs/DEPLOY.md.

name: Deploy to Cloudflare Pages (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build (static web)
        working-directory: frontend
        run: npm run build:web

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=gymcat --branch=${{ github.ref_name }}
