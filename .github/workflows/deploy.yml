# Builds the static web app and deploys it to Cloudflare (Workers static assets).
# Manual only (workflow_dispatch) so a push never fails while the secrets are absent.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers/Pages:Edit) and
# CLOUDFLARE_ACCOUNT_ID. With no Cloudflare account, use the GitHub Pages workflow.

name: Deploy to Cloudflare (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build (static web)
        working-directory: frontend
        run: npm run build:web

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true
        run: npm run deploy
