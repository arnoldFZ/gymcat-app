# Builds the static web app (no backend) and publishes it to GitHub Pages.
# No secrets needed — it uses the automatic GITHUB_TOKEN and Pages. The site lands at
# https://<user>.github.io/<repo>/. Enable Pages once with:
#   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
# (HashRouter means no SPA rewrites are required; vite `base: './'` makes the subpath work.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build (static web)
        working-directory: frontend
        run: npm run build:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
