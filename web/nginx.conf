# GymCat — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).
# Proxy-level rate limit for the API (complements the in-app per-IP limiter).
# conf.d files are included inside http{}, so this zone is defined at http level.
limit_req_zone $binary_remote_addr zone=gymapi:10m rate=10r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. NOTE: a location that sets its own add_header stops inheriting
    # these, so the two cache locations below repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; media-src 'self' data: https://cdn.jsdelivr.net; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'" always;

    # API → backend container
    location /api/ {
        limit_req zone=gymapi burst=30 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so updates show up immediately
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; media-src 'self' data: https://cdn.jsdelivr.net; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'" always;
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
